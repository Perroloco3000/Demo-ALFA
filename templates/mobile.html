<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlfaDent — Asistente Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b141a;
            --header-bg: #202c33;
            --border: #222d34;
            --green: #00a884;
            --green-dark: #005c4b;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --bubble-bot: #202c33;
            --bubble-user: #005c4b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100%; width: 100%;
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg);
        }

        /* ── HEADER ── */
        .header {
            background: var(--header-bg);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .back-btn { color: var(--green); font-size: 1.3rem; cursor: pointer; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .hdr-info { flex: 1; }
        .hdr-name { font-weight: 600; font-size: 0.9rem; }
        .hdr-status {
            font-size: 0.7rem; color: var(--green);
            display: flex; align-items: center; gap: 4px;
        }
        .online-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #25d366; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .hdr-icons { color: var(--text-secondary); font-size: 1.1rem; }

        /* ── QUICK CHIPS ── */
        .chips-bar {
            display: flex; gap: 8px; padding: 8px 12px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            overflow-x: auto; white-space: nowrap;
            flex-shrink: 0;
        }
        .chips-bar::-webkit-scrollbar { display: none; }
        .chip {
            background: var(--bubble-bot);
            color: var(--green);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 6px 13px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: inherit;
            transition: background 0.15s;
        }
        .chip:active { background: var(--green-dark); }

        /* ── ÁREA DE MENSAJES ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 0);
            background-size: 22px 22px;
        }
        .date-sep {
            align-self: center;
            background: #182229;
            color: var(--text-secondary);
            font-size: 0.68rem;
            padding: 4px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .bwrap { display: flex; width: 100%; }
        .bwrap.user { justify-content: flex-end; }
        .bwrap.assistant { justify-content: flex-start; }
        .bubble {
            max-width: 82%;
            padding: 8px 12px 5px;
            border-radius: 8px;
            font-size: 0.875rem;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }
        .bubble.user { background: var(--bubble-user); border-top-right-radius: 2px; }
        .bubble.assistant { background: var(--bubble-bot); border-top-left-radius: 2px; }
        .bmeta {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 3px; margin-top: 3px;
            font-size: 0.62rem; color: rgba(233,237,239,0.45);
        }
        .checks { color: #53bdeb; }

        /* Typing indicator */
        .typing-wrap { display: none; }
        .typing-wrap.show { display: flex; }
        .typing-bubble {
            background: var(--bubble-bot);
            padding: 10px 14px; border-radius: 8px 8px 8px 0;
            display: flex; gap: 4px; align-items: center;
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: .16s; }
        .dot:nth-child(3) { animation-delay: .32s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

        /* ── FOOTER INPUT ── */
        .footer {
            background: #1f2c34;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .msg-input {
            flex: 1;
            background: #2a3942;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
        }
        .msg-input::placeholder { color: var(--text-secondary); }
        .send-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: var(--green);
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .send-btn:active { background: #009070; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="back-btn">←</div>
            <img src="/static/logo.png" style="width: 38px; height: 38px; border-radius: 50%; background: white; padding: 2px; object-fit: contain;">
            <div class="hdr-info">
                <div class="hdr-name">AlfaDent · Alfa IA</div>
                <div class="hdr-status"><span class="online-dot"></span>en línea</div>
            </div>
            <div class="hdr-icons">⋮</div>
        </div>

        <!-- Chips de acceso rápido -->
        <div class="chips-bar">
            <button class="chip" onclick="send('¿Cuáles son los horarios?')">⏰ Horarios</button>
            <button class="chip" onclick="send('¿Dónde están ubicados?')">📍 Ubicación</button>
            <button class="chip" onclick="send('¿Qué servicios ofrecen?')">🩺 Servicios</button>
            <button class="chip" onclick="send('¿Cuánto cuesta la consulta?')">💰 Precios</button>
            <button class="chip" onclick="send('Quiero agendar una cita')">📅 Agendar</button>
        </div>

        <!-- Mensajes -->
        <div class="chat-area" id="chatArea">
            <div class="date-sep">Hoy</div>
            {% for msg in messages %}
            <div class="bwrap {{ msg.role }}">
                <div class="bubble {{ msg.role }}">
                    <div>{{ msg.content | replace('\n', '<br>') | safe }}</div>
                    <div class="bmeta">
                        {{ msg.time }}
                        {% if msg.role == 'assistant' %}<span class="checks">✓✓</span>{% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
            <div class="typing-wrap" id="typingEl">
                <div class="typing-bubble">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="footer">
            <input class="msg-input" id="msgInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        const area    = document.getElementById('chatArea');
        const typingEl = document.getElementById('typingEl');
        const input   = document.getElementById('msgInput');

        function scrollBottom() { area.scrollTop = area.scrollHeight; }
        scrollBottom();

        function addBubble(role, content, time) {
            const wrap = document.createElement('div');
            wrap.className = `bwrap ${role}`;
            const checks = role === 'assistant' ? '<span class="checks">✓✓</span>' : '';
            const html = content
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.*?)`/g, '<code style="background:#111b21;padding:1px 5px;border-radius:3px;">$1</code>');
            wrap.innerHTML = `<div class="bubble ${role}"><div>${html}</div><div class="bmeta">${time}${checks}</div></div>`;
            area.insertBefore(wrap, typingEl);
            scrollBottom();
        }

        const ws = new WebSocket(`ws://${location.host}/ws/mobile`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'chat' && data.role === 'assistant') {
                addBubble('assistant', data.content, data.time);
            } else if (data.type === 'typing') {
                typingEl.className = data.status ? 'typing-wrap show' : 'typing-wrap';
                if (data.status) scrollBottom();
            }
        };

        function send(text) {
            if (!text || ws.readyState !== WebSocket.OPEN) return;
            // Mostrar burbuja del usuario localmente
            const now = new Date();
            const ts = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
            addBubble('user', text, ts);
            ws.send(JSON.stringify({ content: text }));
        }

        function sendMsg() {
            const text = input.value.trim();
            if (text) { send(text); input.value = ''; }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
